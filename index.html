    <script>
      (function() {
        var ow = console.warn;
        var oe = console.error;
        function isIgnored(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('disconnecting idle stream') !== -1 ||
                 s.indexOf('timed out waiting for new targets') !== -1 ||
                 s.indexOf("listen' stream") !== -1 ||
                 s.indexOf('grpcconnection rpc') !== -1 ||
                 s.indexOf('maximum backoff delay') !== -1 ||
                 s.indexOf('resource-exhausted') !== -1 ||
                 s.indexOf('quota limit exceeded') !== -1 ||
                 (s.indexOf('firestore') !== -1 && s.indexOf('stream') !== -1 && s.indexOf('cancelled') !== -1);
        }
        console.warn = function() {
          var all = Array.prototype.slice.call(arguments).map(function(a) {
            try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
          }).join(' ');
          if (isIgnored(all)) return;
          ow.apply(console, arguments);
        };
        console.error = function() {
          var all = Array.prototype.slice.call(arguments).map(function(a) {
            try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
          }).join(' ');
          if (isIgnored(all)) return;
          oe.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-neutral-100 text-neutral-900 antialiased selection:bg-blue-600 selection:text-white">
